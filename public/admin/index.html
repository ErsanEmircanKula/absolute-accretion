<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Fikir Dizini CMS</title>
		<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
		<script>
			window.CMS_MANUAL_INIT = true;
		</script>
	</head>
	<body>
		<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
		<script>
			if (window.location.pathname === '/admin') {
				window.location.replace('/admin/');
			}

			const identityHash = window.location.hash || '';
			const hasIdentityToken = identityHash.includes('invite_token=') || identityHash.includes('recovery_token=');

			if (hasIdentityToken && !window.location.pathname.startsWith('/admin')) {
				window.location.replace(`/admin/${identityHash}`);
			}

			if (window.netlifyIdentity) {
				window.netlifyIdentity.on('init', (user) => {
					if (!user) {
						window.netlifyIdentity.on('login', () => {
							window.location.href = '/admin/';
						});
					}
				});
				window.netlifyIdentity.on('login', () => window.location.reload());
			}

			if (window.CMS) {
				window.CMS.init({
					config: '/admin/config.yml',
				});
			}
		</script>
	</body>
</html>
